name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Bundled assets are up to date
        working-directory: .
        run: |
          if ! git diff --quiet -- netbox_service_canvas/static; then
            echo "::warning::netbox_service_canvas/static differs from a fresh build. Run 'npm run build' in frontend/ and commit the result."
            git status --short -- netbox_service_canvas/static
          fi

  python:
    name: Python (lint, syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check netbox_service_canvas --select E,F
      - run: python -m compileall -q netbox_service_canvas

  netbox:
    name: Django tests (NetBox ${{ matrix.netbox }})
    runs-on: ubuntu-latest
    # Some tests currently fail (see CONTRIBUTING.md, "Tests"). Until they are fixed, this job reports but does not
    # block. Remove continue-on-error once the suite is green.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # v4.5.7: the version the plugin is tested with by hand; newest: the latest 4.5.x release
        netbox: ["v4.5.7", "newest"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out NetBox
        run: |
          tag="${{ matrix.netbox }}"
          if [ "$tag" = newest ]; then
            tag=$(git ls-remote --tags --refs https://github.com/netbox-community/netbox 'v4.5.*' | sed 's#.*/##' | sort -V | tail -1)
          fi
          echo "Testing against NetBox $tag"
          git clone --depth 1 --branch "$tag" https://github.com/netbox-community/netbox.git netbox
      - name: Install NetBox and the plugin
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install -e plugin
      - name: Configure NetBox for testing
        run: |
          cp netbox/netbox/netbox/configuration_testing.py netbox/netbox/netbox/configuration.py
          echo "PLUGINS = ['netbox_service_canvas']" >> netbox/netbox/netbox/configuration.py
      - name: Collect static files
        run: python netbox/netbox/manage.py collectstatic --no-input
      - name: Check for missing migrations
        run: python netbox/netbox/manage.py makemigrations netbox_service_canvas --check --dry-run
      - name: Run the plugin's tests
        run: python netbox/netbox/manage.py test netbox_service_canvas -v 2
