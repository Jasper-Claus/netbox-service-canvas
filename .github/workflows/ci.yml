name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Bundled assets are up to date
        working-directory: .
        run: |
          if ! git diff --quiet -- netbox_service_canvas/static; then
            echo "::warning::netbox_service_canvas/static differs from a fresh build. Run 'npm run build' in frontend/ and commit the result."
            git status --short -- netbox_service_canvas/static
          fi

  python:
    name: Python (lint, syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check netbox_service_canvas --select E,F
      - run: python -m compileall -q netbox_service_canvas
