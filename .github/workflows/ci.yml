name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Bundled assets are up to date
        working-directory: .
        run: |
          if ! git diff --quiet -- netbox_service_canvas/static; then
            echo "::warning::netbox_service_canvas/static differs from a fresh build. Run 'npm run build' in frontend/ and commit the result."
            git status --short -- netbox_service_canvas/static
          fi

  python:
    name: Python (lint, syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check netbox_service_canvas --select E,F
      - run: python -m compileall -q netbox_service_canvas

  netbox:
    name: Django tests (NetBox ${{ matrix.netbox }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the newest release of every supported minor version
        netbox: ["v4.5.7", "4.5", "4.6", "4.7"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out NetBox
        run: |
          tag="${{ matrix.netbox }}"
          case "$tag" in
            v*) ;;
            *) tag=$(git ls-remote --tags --refs https://github.com/netbox-community/netbox "v$tag.*" | sed 's#.*/##' | sort -V | tail -1) ;;
          esac
          echo "Testing against NetBox $tag"
          git clone --depth 1 --branch "$tag" https://github.com/netbox-community/netbox.git netbox
      - name: Install NetBox and the plugin
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install -e plugin
      - name: Configure NetBox for testing
        run: |
          cp netbox/netbox/netbox/configuration_testing.py netbox/netbox/netbox/configuration.py
          echo "PLUGINS = ['netbox_service_canvas']" >> netbox/netbox/netbox/configuration.py
      - name: Collect static files
        run: python netbox/netbox/manage.py collectstatic --no-input
      - name: Check for missing migrations
        # Only against the oldest supported release: NetBox 4.7 adds related_name='+' to the inherited owner field,
        # a state-only difference that would otherwise ask for a migration that 4.5 and 4.6 would then reverse.
        if: matrix.netbox == 'v4.5.7'
        run: python netbox/netbox/manage.py makemigrations netbox_service_canvas --check --dry-run
      - name: Run the plugin's tests
        # NetBox 4.7+ compares list views and API lists against stored query counts (tests/query_counts.json).
        # Without that file the counts are recorded instead and uploaded, so they can be committed.
        run: |
          if [ ! -f plugin/netbox_service_canvas/tests/query_counts.json ] && grep -q UPDATE_QUERY_COUNTS netbox/netbox/utilities/testing/query_counts.py 2>/dev/null; then
            echo "::warning::No query count baseline yet, recording it (download the artifact and commit it)."
            export UPDATE_QUERY_COUNTS=1
          fi
          python netbox/netbox/manage.py test netbox_service_canvas -v 2
      - name: Upload recorded query counts
        if: always() && hashFiles('plugin/netbox_service_canvas/tests/query_counts.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: query-counts-${{ matrix.netbox }}
          path: plugin/netbox_service_canvas/tests/query_counts.json
