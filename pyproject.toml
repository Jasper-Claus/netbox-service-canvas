[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-service-canvas"
version = "0.5.1"
description = "Interactive canvas for NetBox: which services run where, how they talk to each other and what breaks if a host fails."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Jasper Claus" }]
keywords = [
    "netbox", "netbox-plugin", "homelab", "service-map", "dependency-mapping", "impact-analysis", "ipam", "dcim",
    "diagram", "network-documentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: JavaScript",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Jasper-Claus/netbox-service-canvas"
Source = "https://github.com/Jasper-Claus/netbox-service-canvas"
Issues = "https://github.com/Jasper-Claus/netbox-service-canvas/issues"
Changelog = "https://github.com/Jasper-Claus/netbox-service-canvas/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["netbox_service_canvas*"]
exclude = ["netbox_service_canvas.tests*"]

[tool.setuptools.package-data]
netbox_service_canvas = [
    "templates/**/*.html",
    "static/**/*",
]

[tool.setuptools.exclude-package-data]
# The tests need a NetBox test environment and are not useful in an installed package
netbox_service_canvas = ["tests/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["netbox_service_canvas/migrations"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their modules
"__init__.py" = ["F403"]
